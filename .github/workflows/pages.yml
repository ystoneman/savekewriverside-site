name: Validate and deploy compatibility site
run-name: Compatibility ${{ inputs.source_sha || github.sha }}
on:
  pull_request:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact canonical main revision
        required: true
      source_run:
        description: Canonical workflow run with successful validation and deployment
        required: true
permissions:
  contents: read
concurrency:
  group: compatibility-production
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Validate fixed deployment configuration
        run: |
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          d=json.loads(Path('deployment.json').read_text())
          assert d['source_repository']=='ystoneman/savekewriversideprimaryschool-site'
          assert d['origin'] in ['https://ystoneman.github.io/kew-riverside-website/','https://savekewriverside.org/']
          assert not Path('public').exists()
          PYCODE
  prepare:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Verify release provenance before executing any fetched code
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_RUN: ${{ inputs.source_run }}
        run: |
          python3 - <<'PYCODE'
          import json,os,re,urllib.request
          sha=os.environ['SOURCE_SHA']; run=os.environ['SOURCE_RUN']
          assert re.fullmatch('[0-9a-f]{40}',sha) and run.isdigit()
          base='https://api.github.com/repos/ystoneman/savekewriversideprimaryschool-site/actions/runs/'+run
          def read(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Kew-compatibility-bootstrap'}),timeout=30) as r:return json.load(r)
          d=read(base)
          assert d['head_sha']==sha and d['head_branch']=='main' and d['event']=='push' and d['path']=='.github/workflows/pages.yml'
          jobs={j['name']:j['conclusion'] for j in read(base+'/jobs?per_page=100')['jobs']}
          assert all(jobs.get(n)=='success' for n in ['validate','browser-tests','deploy'])
          PYCODE
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ystoneman/savekewriversideprimaryschool-site
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Generate current compatibility bundle
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_RUN: ${{ inputs.source_run }}
        run: python3 .github/scripts/compatibility_release.py prepare --sha "$SOURCE_SHA" --run-id "$SOURCE_RUN" --output "$RUNNER_TEMP/compatibility"
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: ${{ runner.temp }}/compatibility
  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ystoneman/savekewriversideprimaryschool-site
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Reject superseded release immediately before deployment
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_RUN: ${{ inputs.source_run }}
        run: python3 .github/scripts/compatibility_release.py guard --sha "$SOURCE_SHA" --run-id "$SOURCE_RUN"
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
      - name: Verify all served compatibility assets
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_RUN: ${{ inputs.source_run }}
        run: python3 .github/scripts/compatibility_release.py verify --sha "$SOURCE_SHA" --run-id "$SOURCE_RUN" --origin https://savekewriverside.org/

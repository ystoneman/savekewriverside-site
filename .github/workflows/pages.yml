name: Verify and deploy promoted site
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test deployment guards
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Verify asset digests and successful source checks
        run: python3 scripts/verify.py --check-source-run
      - name: Read the verified source revision
        id: tested-source
        run: |
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          source = json.loads(Path('promotion.json').read_text())['source']['commit']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'commit={source}\n')
          PYCODE
      - name: Check out the exact tested source transformer
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ystoneman/kew-riverside-website
          ref: ${{ steps.tested-source.outputs.commit }}
          path: tested-source
          persist-credentials: false
      - name: Build forwarding pages with old-origin draft recovery
        run: python3 tested-source/.github/scripts/build_old_site_redirect.py --source public --output "$RUNNER_TEMP/legacy-site"
      - name: Upload only the verified transformed public directory
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/legacy-site
          retention-days: 1

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified public assets
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
